name: Pinot runtime fulljar classdump fullcoverage capture

on:
  push:
    branches:
      - 'codex/unit-runtime-coverage-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.repository == 'xiangfu0/pinot'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - variant: baseline
            ref: 1b552624f52a96926c67d340d9c27a8de390a4ef
            family: unit
            testset: 1
            core_forks: 3
            integration: 'false'
          - variant: baseline
            ref: 1b552624f52a96926c67d340d9c27a8de390a4ef
            family: unit
            testset: 2
            core_forks: 3
            integration: 'false'
          - variant: baseline
            ref: 1b552624f52a96926c67d340d9c27a8de390a4ef
            family: integration
            testset: 1
            core_forks: 3
            integration: 'true'
          - variant: baseline
            ref: 1b552624f52a96926c67d340d9c27a8de390a4ef
            family: integration
            testset: 2
            core_forks: 3
            integration: 'true'
          - variant: candidate
            ref: baed053b342a531196c43ccf018fbf830c60b902
            family: unit
            testset: 1
            core_forks: 3
            integration: 'false'
          - variant: candidate
            ref: baed053b342a531196c43ccf018fbf830c60b902
            family: unit
            testset: 2
            core_forks: 3
            integration: 'false'
          - variant: candidate
            ref: baed053b342a531196c43ccf018fbf830c60b902
            family: unit
            testset: 3
            core_forks: 3
            integration: 'false'
          - variant: candidate
            ref: baed053b342a531196c43ccf018fbf830c60b902
            family: integration
            testset: 1
            core_forks: 3
            integration: 'true'
          - variant: candidate
            ref: baed053b342a531196c43ccf018fbf830c60b902
            family: integration
            testset: 2
            core_forks: 3
            integration: 'true'
    name: ${{ matrix.family }} set ${{ matrix.testset }} (${{ matrix.variant }})
    env:
      RUN_INTEGRATION_TESTS: ${{ matrix.integration }}
      RUN_TEST_SET: ${{ matrix.testset }}
      PINOT_SOURCE_SHA: ${{ matrix.ref }}
      PINOT_VARIANT: ${{ matrix.variant }}
      PINOT_CAPTURE_SCOPE: ${{ matrix.family }}${{ matrix.testset }}
      PINOT_EXPECTED_CORE_FORKS: ${{ matrix.family == 'unit' && ((matrix.variant != 'candidate' && matrix.testset == 1) || (matrix.variant == 'candidate' && matrix.testset == 3)) && matrix.core_forks || 'not-applicable' }}
      PINOT_CONTROL_SHA: ${{ github.sha }}
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      MAVEN_OPTS: ${{ matrix.family == 'integration' && '-Xmx2G -DskipShade -DfailIfNoTests=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=30 -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -B -ntp -XX:+IgnoreUnrecognizedVMOptions --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED' || '-Xmx2G -DskipShade -DfailIfNoTests=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=30 -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -B -ntp -XX:+IgnoreUnrecognizedVMOptions --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true -Dio.grpc.netty.shaded.io.netty.tryReflectionSetAccessible=true' }}
    steps:
      - name: Checkout capture tools from the validation workflow commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: |
            .github/workflows/scripts/pr-tests/capture_test_evidence_v4.py
            .github/workflows/scripts/pr-tests/run_validation_phase_v4.py
            .github/workflows/scripts/pr-tests/observe_kafka_docker.py
          sparse-checkout-cone-mode: false
      - name: Freeze capture tools outside the tested checkout
        shell: bash
        run: |
          python3 - <<'PYTOOLS'
          import hashlib, json, os, shutil, time
          from pathlib import Path
          control = Path(os.environ['RUNNER_TEMP']) / 'pinot-validation-control'
          control.mkdir(exist_ok=False)
          public = Path(os.environ['RUNNER_TEMP']) / 'pinot-validation-evidence'
          public.mkdir(exist_ok=False)
          dump = Path(os.environ['RUNNER_TEMP']).resolve() / 'pinot-runtime-class-dumps'
          dump.mkdir(exist_ok=False)
          assert '-Djacoco.classDumpDir' not in os.environ['MAVEN_OPTS']
          expected_tool_pins = {'capture_test_evidence_v4.py': '47914a69ab46bc308488bce1795a294a6b4f0d079fe23b1872bcc5621ba2c0df', 'run_validation_phase_v4.py': '070632b117883dc4d81882b31f85bb8c70eec3e449534c79ca66b59aa811decd'}
          pins = {}
          for name in ['capture_test_evidence_v4.py', 'run_validation_phase_v4.py']:
              source = Path('harness/.github/workflows/scripts/pr-tests') / name
              target = control / name
              shutil.copy2(source, target)
              pins[name] = hashlib.sha256(target.read_bytes()).hexdigest()
              assert pins[name] == expected_tool_pins[name], 'Pinned V4 helper bytes changed'
              alias = 'collector-source.py' if name == 'capture_test_evidence_v4.py' else 'runner-source.py'
              shutil.copy2(target, public / alias)
          (public / 'capture-tool-pins.json').write_text(json.dumps(pins, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PINOT_CAPTURE_HELPER={control / "capture_test_evidence_v4.py"}\n')
              stream.write(f'PINOT_PHASE_RUNNER={control / "run_validation_phase_v4.py"}\n')
              stream.write(f'PINOT_VALIDATION_DIR={public}\n')
              stream.write(f'PINOT_CLASS_DUMP_ROOT={dump}\n')
              stream.write('MAVEN_OPTS=' + os.environ['MAVEN_OPTS'] + f' -Djacoco.classDumpDir={dump}\n')
              stream.write(f'PINOT_BUILD_START_EPOCH={time.time():.9f}\n')
          PYTOOLS
      - name: Freeze separate Unit2 Docker observer outside tested checkout
        if: ${{ matrix.family == 'unit' && matrix.testset == 2 }}
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PYDIAGNOSTIC'
          import hashlib, os, shutil
          from pathlib import Path
          source = Path('harness/.github/workflows/scripts/pr-tests/observe_kafka_docker.py')
          target = Path(os.environ['RUNNER_TEMP']) / 'pinot-validation-control' / 'observe_kafka_docker.py'
          assert not target.exists(), 'Diagnostic observer target already exists'
          expected = 'c6f94d67ee16c08a909bbcfe4829c4d596b80463e1eac0a8b1de3b2337fd87ce'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected, 'Diagnostic source changed'
          shutil.copyfile(source, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == expected, 'Diagnostic copy changed'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PINOT_DOCKER_OBSERVER={target}\n')
          PYDIAGNOSTIC
      - name: Checkout the pinned tested source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.ref }}
          path: source
          clean: true
          fetch-depth: 1
      - name: Verify pinned checkout and record runner inventory
        shell: bash
        working-directory: source
        run: |
          python3 - <<'PYINVENTORY'
          import json, os, platform, subprocess
          from pathlib import Path
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['PINOT_SOURCE_SHA']
          assert subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip() == ''
          result = {'source_sha': actual, 'workflow_sha': os.environ['PINOT_CONTROL_SHA'],
                    'cpu_count': os.cpu_count(), 'cpu_affinity': sorted(os.sched_getaffinity(0)),
                    'platform': platform.platform(), 'runner_os': os.environ.get('RUNNER_OS'),
                    'runner_arch': os.environ.get('RUNNER_ARCH'), 'inventory': {}}
          for command in [['lscpu', '--json'], ['free', '--bytes'], ['df', '-B1']]:
              value = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              result['inventory'][' '.join(command)] = {'exit_code': value.returncode, 'stdout': value.stdout}
          Path(os.environ['PINOT_VALIDATION_DIR'], 'runner-inventory.json').write_text(json.dumps(result, indent=2) + '\n')
          PYINVENTORY
      - name: Set up JDK 25-temurin
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Restore Maven cache using the original PR key
        uses: actions/cache@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('source/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build Project using the original script
        timeout-minutes: 30
        shell: bash
        run: |
          python3 "$PINOT_PHASE_RUNNER" --root "$GITHUB_WORKSPACE/source" \
            --output "$PINOT_VALIDATION_DIR" --phase build \
            --expected-head "$PINOT_SOURCE_SHA" \
            --own-repository-root "$HOME/.m2/repository/org/apache/pinot" \
            --script .github/workflows/scripts/pr-tests/.pinot_tests_build.sh
      - name: Unit Test using the original script
        if: ${{ matrix.family == 'unit' }}
        timeout-minutes: 105
        shell: bash
        run: |
          observer_pid=''
          observer_output="$RUNNER_TEMP/docker-diagnostic-$PINOT_VARIANT-unit2-$GITHUB_RUN_ATTEMPT"
          finish_unit_diagnostic() {
            original_phase_status=$?
            set +e
            trap - EXIT
            if [[ -d "$observer_output" ]]; then
              : > "$observer_output/stop.request"
            fi
            if [[ -n "$observer_pid" ]]; then
              for ((observer_wait=0; observer_wait<60; observer_wait++)); do
                kill -0 "$observer_pid" 2>/dev/null || break
                sleep 0.25
              done
            fi
            exit "$original_phase_status"
          }
          if [[ "$PINOT_CAPTURE_SCOPE" == 'unit2' && -n "${PINOT_DOCKER_OBSERVER:-}" ]]; then
            trap finish_unit_diagnostic EXIT
            python3 "$PINOT_DOCKER_OBSERVER" \
              --workspace "$GITHUB_WORKSPACE/source" --runner-temp "$RUNNER_TEMP" \
              --output "$observer_output" --owner-pid "$$" \
              --source "$PINOT_SOURCE_SHA" --control "$PINOT_CONTROL_SHA" \
              --role "$PINOT_VARIANT" --run-id "$GITHUB_RUN_ID" \
              --attempt "$GITHUB_RUN_ATTEMPT" --seconds 7200 \
              > "$RUNNER_TEMP/docker-observer-$PINOT_VARIANT-unit2-bootstrap.log" 2>&1 &
            observer_pid=$!
          elif [[ "$PINOT_CAPTURE_SCOPE" == 'unit2' ]]; then
            printf '%s\n' 'Diagnostic Docker observer unavailable; original unit phase continues.' \
              > "$RUNNER_TEMP/docker-observer-$PINOT_VARIANT-unit2-bootstrap.log" 2>&1 || :
          fi
          python3 "$PINOT_PHASE_RUNNER" --root "$GITHUB_WORKSPACE/source" \
            --output "$PINOT_VALIDATION_DIR" --phase unit \
            --expected-head "$PINOT_SOURCE_SHA" \
            --own-repository-root "$HOME/.m2/repository/org/apache/pinot" \
            --script .github/workflows/scripts/pr-tests/.pinot_tests_unit.sh
      - name: Concurrent integration lanes using the original script
        if: ${{ matrix.family == 'integration' }}
        timeout-minutes: 105
        shell: bash
        run: |
          python3 "$PINOT_PHASE_RUNNER" --root "$GITHUB_WORKSPACE/source" \
            --output "$PINOT_VALIDATION_DIR" --phase integration \
            --expected-head "$PINOT_SOURCE_SHA" \
            --own-repository-root "$HOME/.m2/repository/org/apache/pinot" \
            --script .github/workflows/scripts/pr-tests/.pinot_tests_two_lane_integration.sh
      - name: Seal raw test and coverage evidence
        if: ${{ always() && env.PINOT_BUILD_START_EPOCH != '' }}
        timeout-minutes: 15
        shell: bash
        run: |
          log_arguments=()
          for original in \
            "$PINOT_VALIDATION_DIR/build.log" \
            "$PINOT_VALIDATION_DIR/${{ matrix.family }}.log" \
            "$PINOT_VALIDATION_DIR/process-samples-01.jsonl" \
            "$PINOT_VALIDATION_DIR/process-samples-02.jsonl" \
            "$PINOT_VALIDATION_DIR/runner-inventory.json" \
            "$PINOT_VALIDATION_DIR/capture-tool-pins.json" \
            "$PINOT_VALIDATION_DIR/inputs-before-run.json" \
            "$PINOT_VALIDATION_DIR/inputs-after-run.json" \
            "$PINOT_VALIDATION_DIR/ordinary-jars-before-test.json" \
            "$PINOT_VALIDATION_DIR/ordinary-jars-after-test.json" \
            "$PINOT_VALIDATION_DIR/collector-source.py" \
            "$PINOT_VALIDATION_DIR/runner-source.py" \
            "$GITHUB_WORKSPACE/source/pinot-integration-tests/target-concurrent-logs/lane-a.log" \
            "$GITHUB_WORKSPACE/source/pinot-integration-tests/target-concurrent-logs/lane-b.log"; do
            if [ -f "$original" ]; then
              log_arguments+=(--log "$original")
            fi
          done
          generated_arguments=()
          for generated in \
            pinot-integration-tests/target-lane-a \
            pinot-integration-tests/target-lane-b \
            pinot-integration-tests/examples/batch/baseballStats/segments \
            pinot-plugins/pinot-batch-ingestion/pinot-batch-ingestion-hadoop/pinot-plugins.tar.gz; do
            if [ -e "$GITHUB_WORKSPACE/source/$generated" ]; then
              generated_arguments+=(--allow-generated-output-path "$generated")
            fi
          done
          metadata_arguments=()
          if [ -f "$PINOT_VALIDATION_DIR/run-metadata.json" ]; then
            metadata_arguments+=(--metadata "$PINOT_VALIDATION_DIR/run-metadata.json")
          fi
          python3 "$PINOT_CAPTURE_HELPER" --root "$GITHUB_WORKSPACE/source" \
            --output "$PINOT_VALIDATION_DIR/evidence.tar.gz" \
            --label "${GITHUB_JOB}-${PINOT_VARIANT}-${PINOT_CAPTURE_SCOPE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --variant "$PINOT_VARIANT" --expected-head "$PINOT_SOURCE_SHA" \
            --started-at "$PINOT_BUILD_START_EPOCH" \
            --class-dump-root "$PINOT_CLASS_DUMP_ROOT" \
            "${metadata_arguments[@]}" "${log_arguments[@]}" "${generated_arguments[@]}"
      - name: Upload evidence even when a build, test, or guard fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: full-capture-${{ matrix.variant }}-${{ matrix.family }}${{ matrix.testset }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinot-validation-evidence/evidence.tar.gz
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: 30
      - name: Upload separate Unit2 Docker diagnostic
        if: ${{ always() && matrix.family == 'unit' && matrix.testset == 2 }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-diagnostic-${{ matrix.variant }}-unit2-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docker-diagnostic-${{ matrix.variant }}-unit2-${{ github.run_attempt }}/
            ${{ runner.temp }}/docker-observer-${{ matrix.variant }}-unit2-bootstrap.log
          if-no-files-found: warn
          compression-level: 6
          include-hidden-files: true
          retention-days: 30
